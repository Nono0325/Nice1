[package]
name = "servo_control"
version = "2.0.0"
edition = "2021"
authors = ["Nice Stamping Automation Team"]
description = "Industrial Raspberry Pi Stepper Motor & Electromagnet Controller in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
